# Publie le site sur GitHub Pages à chaque push sur la branche main.
# Activer une fois : dépôt GitHub → Settings → Pages → Source : « GitHub Actions ».
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permet aussi de lancer la publication à la main (onglet Actions)

# Par défaut, lecture seule ; les droits d'écriture sont donnés au seul job « deploy ».
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts : les paquets installés ne peuvent pas exécuter de scripts (sécurité)
      - run: npm ci --ignore-scripts
      - run: npm run build # vérifie les données puis construit dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publier sur GitHub Pages
      id-token: write # prouver l'identité du workflow auprès de Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
